name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node node_modules/wxt/bin/wxt.mjs build

      - name: Zip extension
        run: cd .output/chrome-mv3 && zip -r ../../tiny-api-hub-chrome.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-api-hub-chrome
          path: tiny-api-hub-chrome.zip
          retention-days: 90
