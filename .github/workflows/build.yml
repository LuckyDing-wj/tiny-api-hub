name: Build Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tag 构建时强制把版本号同步成 tag 名，防 package.json 与 tag 脱节
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      # allowBuilds 需 pnpm >= 10.26，与本地 pnpm 11 对齐
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node node_modules/wxt/bin/wxt.mjs build

      - name: Zip extension
        run: cd .output/chrome-mv3 && zip -r ../../tiny-api-hub-chrome.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-api-hub-chrome
          path: tiny-api-hub-chrome.zip
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tiny-api-hub-chrome.zip
          generate_release_notes: true
